[metadata]
name = pynidm
description = PYNIDM: a Python NIDM library and tools
long_description = file:README.rst
long_description_content_type = text/x-rst
author = INCF-NIDASH developers
author_email = incf-nidash-nidm@googlegroups.com
maintainer = INCF-NIDASH developers
maintainer_email = incf-nidash-nidm@googlegroups.com
license = Apache-2.0
license_files = LICENSE
url = https://github.com/incf-nidash/PyNIDM

classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Intended Audience :: Science/Research
    License :: OSI Approved :: Apache Software License
    Operating System :: MacOS :: MacOS X
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3
    Topic :: Scientific/Engineering

[options]
packages = find_namespace:
package_dir =
    =src
include_package_data = True
python_requires = >=3.10
install_requires =
    click
    click-option-group
    cognitiveatlas
    datalad
    etelemetry
    numpy >= 1.16.5
    ontquery ~= 0.2.3
    pyontutils
    pandas >= 2.0
    pyarrow
    patsy
    pybids >= 0.12.4
    pydot ~= 1.4.2
    pygithub
    pyld >= 1.0.5, <3.0
    python-dateutil ~= 2.0
    rapidfuzz
    requests
    scikit-learn
    scipy
    statsmodels
    tabulate
    validators
    rdflib >= 6.3.2, < 8
    oxrdflib ~= 0.5.0
    pydantic >= 2

[options.extras_require]
tools =
    matplotlib
    seaborn
test =
    importlib-resources; python_version < '3.9'
    pytest
    pytest-cov
linkml =
    # Pinned: generator output (nidm_schema_pydantic.py) drifts across linkml
    # releases, so contributors must regenerate with the same version.  Bump
    # this and re-run `python scripts/regen_schema.py` together.
    linkml==1.11.1
    linkml-runtime
    pydantic
queryai =
    # Optional LLM backends for `pynidm queryai` (imported lazily at call time).
    anthropic
    openai
devel =
    %(test)s
    %(linkml)s
    %(queryai)s
    pre-commit

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    bidsmri2nidm = nidm.linkml.experiment.tools.bidsmri2nidm:main
    csv2nidm = nidm.linkml.experiment.tools.csv2nidm:csv2nidm_main
    nidm_query = nidm.linkml.experiment.tools.nidm_query:query
    nidm_utils = nidm.linkml.experiment.tools.nidm_utils:main
    pynidm = nidm.linkml.experiment.tools.click_main:cli
